<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertChain Protocol</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
      /* ── VARIÁVEIS ── */
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --accent: #58a6ff;
        --accent2: #3fb950;
        --accent3: #f78166;
        --accent4: #d2a8ff;
        --text: #e6edf3;
        --muted: #8b949e;
        --radius: 10px;
        --font: "Courier New", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        min-height: 100vh;
        padding: 24px 16px;
      }

      /* ── HEADER ── */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1000px;
        margin: 0 auto 28px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .logo {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
        color: var(--accent);
      }

      .logo span {
        color: var(--text);
      }

      #btn-connect {
        background: var(--accent);
        color: #0d1117;
        border: none;
        padding: 10px 20px;
        border-radius: var(--radius);
        font-family: var(--font);
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 1px;
        transition: opacity 0.2s;
      }

      #btn-connect:hover {
        opacity: 0.85;
      }

      /* ── STATS BAR ── */
      .stats-bar {
        display: flex;
        gap: 16px;
        max-width: 1000px;
        margin: 0 auto 28px;
        flex-wrap: wrap;
      }

      .stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 20px;
        flex: 1;
        min-width: 160px;
      }

      .stat-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }

      .stat-value {
        font-size: 18px;
        font-weight: bold;
        color: var(--accent);
      }

      /* ── GRID DE CARDS ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        max-width: 1000px;
        margin: 0 auto;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .card-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .card-title {
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 1px;
        color: var(--text);
      }

      .card-badge {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        background: var(--bg);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .card-body {
        padding: 20px;
      }

      /* ── INPUTS ── */
      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .field input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 12px;
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }

      .field input:focus {
        border-color: var(--accent);
      }

      /* ── BOTÕES DE AÇÃO ── */
      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-family: var(--font);
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        transition: opacity 0.2s;
        margin-top: 4px;
      }

      .btn:hover {
        opacity: 0.85;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-blue {
        background: var(--accent);
        color: #0d1117;
      }
      .btn-green {
        background: var(--accent2);
        color: #0d1117;
      }
      .btn-red {
        background: var(--accent3);
        color: #0d1117;
      }
      .btn-purple {
        background: var(--accent4);
        color: #0d1117;
      }

      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        margin-top: 8px;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 16px 0;
      }

      /* ── OUTPUT DE RESULTADO ── */
      .result-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--accent2);
        min-height: 38px;
        word-break: break-all;
        display: none;
      }

      .result-box.visible {
        display: block;
      }

      /* ── TOAST ── */
      #toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 9999;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 18px;
        font-size: 13px;
        max-width: 340px;
        animation: slideIn 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toast.success {
        border-left: 3px solid var(--accent2);
      }
      .toast.error {
        border-left: 3px solid var(--accent3);
      }
      .toast.info {
        border-left: 3px solid var(--accent);
      }

      @keyframes slideIn {
        from {
          transform: translateX(100px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* ── ENDEREÇO CONECTADO ── */
      #wallet-info {
        font-size: 12px;
        color: var(--muted);
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">CERT<span>CHAIN</span></div>
      <div id="wallet-info">🔗 <span id="wallet-address"></span></div>
      <button id="btn-connect" onclick="connectWallet()">
        CONECTAR METAMASK
      </button>
    </header>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-label">Rede</div>
        <div class="stat-value" id="stat-network">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Saldo ETH</div>
        <div class="stat-value" id="stat-eth">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Saldo CERT</div>
        <div class="stat-value" id="stat-cert">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">ETH/USD</div>
        <div class="stat-value" id="stat-price">—</div>
      </div>
    </div>

    <!-- GRID DE CONTRATOS -->
    <div class="grid">
      <!-- CARD: CertificateToken -->
      <div class="card">
        <div class="card-header">
          <div class="card-dot" style="background: var(--accent)"></div>
          <div class="card-title">CertificateToken</div>
          <div class="card-badge">ERC-20</div>
        </div>
        <div class="card-body">
          <div class="field">
            <label>Endereço destino</label>
            <input id="token-to" placeholder="0x..." />
          </div>
          <div class="field">
            <label>Quantidade (CERT)</label>
            <input id="token-amount" type="number" placeholder="100" />
          </div>
          <button class="btn btn-blue" onclick="transferToken()">
            TRANSFERIR
          </button>
          <hr class="divider" />
          <button class="btn btn-outline" onclick="getTokenBalance()">
            VER MEU SALDO
          </button>
          <div class="result-box" id="result-token"></div>
        </div>
      </div>

      <!-- CARD: CertificateNFT -->
      <div class="card">
        <div class="card-header">
          <div class="card-dot" style="background: var(--accent3)"></div>
          <div class="card-title">CertificateNFT</div>
          <div class="card-badge">ERC-721</div>
        </div>
        <div class="card-body">
          <div class="field">
            <label>Endereço do aluno</label>
            <input id="nft-student" placeholder="0x..." />
          </div>
          <div class="field">
            <label>Nome do aluno</label>
            <input id="nft-name" placeholder="João Silva" />
          </div>
          <div class="field">
            <label>Nome do curso</label>
            <input id="nft-course" placeholder="Web3 Avançado" />
          </div>
          <div class="field">
            <label>Emissor</label>
            <input id="nft-issuer" placeholder="SENAI" />
          </div>
          <button class="btn btn-red" onclick="mintNFT()">
            EMITIR CERTIFICADO
          </button>
          <hr class="divider" />
          <div class="field">
            <label>Token ID para consultar</label>
            <input id="nft-query-id" type="number" placeholder="0" />
          </div>
          <button class="btn btn-outline" onclick="getCertificate()">
            CONSULTAR CERTIFICADO
          </button>
          <div class="result-box" id="result-nft"></div>
        </div>
      </div>

      <!-- CARD: CertificateStaking -->
      <div class="card">
        <div class="card-header">
          <div class="card-dot" style="background: var(--accent2)"></div>
          <div class="card-title">CertificateStaking</div>
          <div class="card-badge">STAKING</div>
        </div>
        <div class="card-body">
          <div class="field">
            <label>Valor em ETH para stake</label>
            <input
              id="stake-amount"
              type="number"
              placeholder="0.01"
              step="0.001"
            />
          </div>
          <button class="btn btn-green" onclick="doStake()">FAZER STAKE</button>
          <hr class="divider" />
          <div class="field">
            <label>Valor em ETH para retirar</label>
            <input
              id="unstake-amount"
              type="number"
              placeholder="0.01"
              step="0.001"
            />
          </div>
          <button class="btn btn-outline" onclick="doUnstake()">
            RETIRAR STAKE
          </button>
          <button class="btn btn-outline" onclick="claimReward()">
            RESGATAR RECOMPENSAS
          </button>
          <button class="btn btn-outline" onclick="getStakingInfo()">
            VER MEU STAKE
          </button>
          <div class="result-box" id="result-staking"></div>
        </div>
      </div>

      <!-- CARD: CertificateGovernance -->
      <div class="card">
        <div class="card-header">
          <div class="card-dot" style="background: var(--accent4)"></div>
          <div class="card-title">CertificateGovernance</div>
          <div class="card-badge">DAO</div>
        </div>
        <div class="card-body">
          <div class="field">
            <label>Endereço do emissor</label>
            <input id="gov-emitter" placeholder="0x..." />
          </div>
          <div class="field">
            <label>Descrição da proposta</label>
            <input id="gov-desc" placeholder="Aprovar SENAI como emissor" />
          </div>
          <button class="btn btn-purple" onclick="createProposal()">
            CRIAR PROPOSTA
          </button>
          <hr class="divider" />
          <div class="field">
            <label>ID da proposta para votar</label>
            <input id="gov-proposal-id" type="number" placeholder="0" />
          </div>
          <div style="display: flex; gap: 8px">
            <button
              class="btn btn-green"
              style="margin-top: 4px"
              onclick="vote(true)"
            >
              VOTAR A FAVOR
            </button>
            <button
              class="btn btn-red"
              style="margin-top: 4px"
              onclick="vote(false)"
            >
              VOTAR CONTRA
            </button>
          </div>
          <hr class="divider" />
          <div class="field">
            <label>ID da proposta para executar</label>
            <input id="gov-exec-id" type="number" placeholder="0" />
          </div>
          <button class="btn btn-outline" onclick="executeProposal()">
            EXECUTAR PROPOSTA
          </button>
          <button class="btn btn-outline" onclick="getProposal()">
            CONSULTAR PROPOSTA
          </button>
          <div class="result-box" id="result-gov"></div>
        </div>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <script>
      // ─────────────────────────────────────────
      //  SUBSTITUA PELOS ENDEREÇOS APÓS O DEPLOY
      // ─────────────────────────────────────────
      const ADDRESSES = {
        token: "0xd8b934580fcE35a11B58C6D73aDeE468a2833fa8",
        nft: "0xf8e81D47203A594245E36C48e151709F0C19fBe8",
        staking: "0xD7ACd2a9FD159E69Bb102A1ca21C9a3e3A5F771B",
        governance: "0x7EF2e0048f5bAeDe046f6BF797943daF4ED8CB47",
      };

      // ─── ABIs mínimas ───
      const ABI_TOKEN = [
        "function transfer(address to, uint256 amount) returns (bool)",
        "function balanceOf(address account) view returns (uint256)",
        "function decimals() view returns (uint8)",
      ];

      const ABI_NFT = [
        "function mintCertificate(address student, string studentName, string courseName, string issuerName)",
        "function getCertificate(uint256 tokenId) view returns (tuple(string studentName, string courseName, string issuerName, uint256 issuedAt))",
      ];

      const ABI_STAKING = [
        "function stake() payable",
        "function unstake(uint256 amount)",
        "function claimReward()",
        "function stakedBalance(address) view returns (uint256)",
        "function calculateReward(address) view returns (uint256)",
        "function getETHPrice() view returns (int256)",
      ];

      const ABI_GOV = [
        "function createProposal(address emitterAddress, bool approveEmitter, string description)",
        "function vote(uint256 proposalId, bool support)",
        "function executeProposal(uint256 proposalId)",
        "function getProposal(uint256 proposalId) view returns (tuple(uint256 id, address emitterAddress, bool approveEmitter, string description, uint256 votesFor, uint256 votesAgainst, uint256 deadline, uint8 status))",
      ];

      // ─── Estado global ───
      let provider, signer, userAddress;

      // ─── Conectar MetaMask ───
      async function connectWallet() {
        if (!window.ethereum) {
          toast("MetaMask não encontrada!", "error");
          return;
        }
        try {
          provider = new ethers.BrowserProvider(window.ethereum);
          signer = await provider.getSigner();
          userAddress = await signer.getAddress();

          document.getElementById("wallet-address").textContent =
            userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
          document.getElementById("wallet-info").style.display = "block";
          document.getElementById("btn-connect").textContent = "CONECTADO ✓";
          document.getElementById("btn-connect").disabled = true;

          await updateStats();
          toast("Carteira conectada com sucesso!", "success");
        } catch (e) {
          toast("Erro ao conectar: " + e.message, "error");
        }
      }

      // ─── Atualizar stats bar ───
      async function updateStats() {
        try {
          const network = await provider.getNetwork();
          document.getElementById("stat-network").textContent =
            network.name === "unknown" ? "Sepolia" : network.name;

          const ethBal = await provider.getBalance(userAddress);
          document.getElementById("stat-eth").textContent =
            parseFloat(ethers.formatEther(ethBal)).toFixed(4) + " ETH";

          const token = new ethers.Contract(
            ADDRESSES.token,
            ABI_TOKEN,
            provider,
          );
          const certBal = await token.balanceOf(userAddress);
          document.getElementById("stat-cert").textContent =
            parseFloat(ethers.formatEther(certBal)).toFixed(2) + " CERT";

          const staking = new ethers.Contract(
            ADDRESSES.staking,
            ABI_STAKING,
            provider,
          );
          const price = await staking.getETHPrice();
          document.getElementById("stat-price").textContent =
            "$ " + (Number(price) / 1e8).toFixed(2);
        } catch (e) {
          console.error("Stats error:", e);
        }
      }

      // ─── Token: transferir ───
      async function transferToken() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const to = document.getElementById("token-to").value;
        const amount = document.getElementById("token-amount").value;
        if (!to || !amount) {
          toast("Preencha todos os campos", "error");
          return;
        }
        try {
          const token = new ethers.Contract(ADDRESSES.token, ABI_TOKEN, signer);
          const tx = await token.transfer(to, ethers.parseEther(amount));
          toast("Transação enviada, aguardando confirmação...", "info");
          await tx.wait();
          toast(
            "Transferência realizada! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
          await updateStats();
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Token: ver saldo ───
      async function getTokenBalance() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        try {
          const token = new ethers.Contract(
            ADDRESSES.token,
            ABI_TOKEN,
            provider,
          );
          const bal = await token.balanceOf(userAddress);
          showResult(
            "result-token",
            "Saldo: " + ethers.formatEther(bal) + " CERT",
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── NFT: emitir certificado ───
      async function mintNFT() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const student = document.getElementById("nft-student").value;
        const name = document.getElementById("nft-name").value;
        const course = document.getElementById("nft-course").value;
        const issuer = document.getElementById("nft-issuer").value;
        if (!student || !name || !course || !issuer) {
          toast("Preencha todos os campos", "error");
          return;
        }
        try {
          const nft = new ethers.Contract(ADDRESSES.nft, ABI_NFT, signer);
          const tx = await nft.mintCertificate(student, name, course, issuer);
          toast("Emitindo certificado, aguardando confirmação...", "info");
          await tx.wait();
          toast(
            "Certificado emitido! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── NFT: consultar certificado ───
      async function getCertificate() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const id = document.getElementById("nft-query-id").value;
        try {
          const nft = new ethers.Contract(ADDRESSES.nft, ABI_NFT, provider);
          const cert = await nft.getCertificate(id);
          const date = new Date(
            Number(cert.issuedAt) * 1000,
          ).toLocaleDateString("pt-BR");
          showResult(
            "result-nft",
            "Aluno: " +
              cert.studentName +
              "\n" +
              "Curso: " +
              cert.courseName +
              "\n" +
              "Emissor: " +
              cert.issuerName +
              "\n" +
              "Data: " +
              date,
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Staking: fazer stake ───
      async function doStake() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const amount = document.getElementById("stake-amount").value;
        if (!amount) {
          toast("Informe o valor", "error");
          return;
        }
        try {
          const staking = new ethers.Contract(
            ADDRESSES.staking,
            ABI_STAKING,
            signer,
          );
          const tx = await staking.stake({ value: ethers.parseEther(amount) });
          toast("Stake enviado, aguardando confirmação...", "info");
          await tx.wait();
          toast(
            "Stake realizado! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
          await updateStats();
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Staking: retirar stake ───
      async function doUnstake() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const amount = document.getElementById("unstake-amount").value;
        if (!amount) {
          toast("Informe o valor", "error");
          return;
        }
        try {
          const staking = new ethers.Contract(
            ADDRESSES.staking,
            ABI_STAKING,
            signer,
          );
          const tx = await staking.unstake(ethers.parseEther(amount));
          toast("Retirada enviada, aguardando confirmação...", "info");
          await tx.wait();
          toast(
            "Stake retirado! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
          await updateStats();
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Staking: resgatar recompensas ───
      async function claimReward() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        try {
          const staking = new ethers.Contract(
            ADDRESSES.staking,
            ABI_STAKING,
            signer,
          );
          const tx = await staking.claimReward();
          toast("Resgatando recompensas...", "info");
          await tx.wait();
          toast(
            "Recompensas resgatadas! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
          await updateStats();
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Staking: ver info ───
      async function getStakingInfo() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        try {
          const staking = new ethers.Contract(
            ADDRESSES.staking,
            ABI_STAKING,
            provider,
          );
          const bal = await staking.stakedBalance(userAddress);
          const reward = await staking.calculateReward(userAddress);
          showResult(
            "result-staking",
            "Em stake: " +
              ethers.formatEther(bal) +
              " ETH\n" +
              "Recompensa pendente: " +
              ethers.formatEther(reward) +
              " CERT",
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Governance: criar proposta ───
      async function createProposal() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const emitter = document.getElementById("gov-emitter").value;
        const desc = document.getElementById("gov-desc").value;
        if (!emitter || !desc) {
          toast("Preencha todos os campos", "error");
          return;
        }
        try {
          const gov = new ethers.Contract(
            ADDRESSES.governance,
            ABI_GOV,
            signer,
          );
          const tx = await gov.createProposal(emitter, true, desc);
          toast("Proposta criada, aguardando confirmação...", "info");
          await tx.wait();
          toast(
            "Proposta criada! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Governance: votar ───
      async function vote(support) {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const id = document.getElementById("gov-proposal-id").value;
        if (id === "") {
          toast("Informe o ID da proposta", "error");
          return;
        }
        try {
          const gov = new ethers.Contract(
            ADDRESSES.governance,
            ABI_GOV,
            signer,
          );
          const tx = await gov.vote(id, support);
          toast("Voto enviado, aguardando confirmação...", "info");
          await tx.wait();
          toast(
            "Voto registrado! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Governance: executar proposta ───
      async function executeProposal() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const id = document.getElementById("gov-exec-id").value;
        if (id === "") {
          toast("Informe o ID da proposta", "error");
          return;
        }
        try {
          const gov = new ethers.Contract(
            ADDRESSES.governance,
            ABI_GOV,
            signer,
          );
          const tx = await gov.executeProposal(id);
          toast("Executando proposta...", "info");
          await tx.wait();
          toast(
            "Proposta executada! TX: " + tx.hash.slice(0, 12) + "...",
            "success",
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Governance: consultar proposta ───
      async function getProposal() {
        if (!signer) {
          toast("Conecte a carteira primeiro", "error");
          return;
        }
        const id = document.getElementById("gov-exec-id").value;
        if (id === "") {
          toast("Informe o ID da proposta", "error");
          return;
        }
        try {
          const gov = new ethers.Contract(
            ADDRESSES.governance,
            ABI_GOV,
            provider,
          );
          const p = await gov.getProposal(id);
          const status = ["Ativa", "Aprovada", "Rejeitada"][p.status];
          const deadline = new Date(
            Number(p.deadline) * 1000,
          ).toLocaleDateString("pt-BR");
          showResult(
            "result-gov",
            "Emissor: " +
              p.emitterAddress +
              "\n" +
              "Descrição: " +
              p.description +
              "\n" +
              "A favor: " +
              ethers.formatEther(p.votesFor) +
              " CERT\n" +
              "Contra: " +
              ethers.formatEther(p.votesAgainst) +
              " CERT\n" +
              "Prazo: " +
              deadline +
              "\n" +
              "Status: " +
              status,
          );
        } catch (e) {
          toast("Erro: " + e.message, "error");
        }
      }

      // ─── Helpers ───
      function showResult(id, text) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.classList.add("visible");
      }

      function toast(msg, type = "info") {
        const container = document.getElementById("toast-container");
        const el = document.createElement("div");
        el.className = "toast " + type;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    </script>
  </body>
</html>
